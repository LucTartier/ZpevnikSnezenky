name: Générer index.json et Chansons.zip
on:
  workflow_dispatch:   # Bouton "Run workflow" dans l'onglet Actions
  push:

permissions:
  contents: write

env:
  DOSSIER: Chansons   # Dossier contenant les fichiers .txt

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer index.json et Chansons.zip
        run: |
          python3 - <<'EOF'
          import json, os, zipfile

          dossier = os.environ['DOSSIER']
          noms = sorted(f for f in os.listdir(dossier) if f.lower().endswith('.txt'))

          # 1. Génération de index.json
          with open('index.json', 'w', encoding='utf-8') as f:
              json.dump(noms, f, ensure_ascii=False, indent=2)

          # 2. Génération de Chansons.zip
          with zipfile.ZipFile('Chansons.zip', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for nom in noms:
                  chemin = os.path.join(dossier, nom)
                  zipf.write(chemin, arcname=nom)
          EOF

      - name: Enregistrer si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json Chansons.zip
          git diff --staged --quiet || (git commit -m "Mise à jour de index.json et Chansons.zip" && git push)
